name: Build Windows test app

on:
  push:
    branches: ['release/0.8.0']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 test archive
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CC: clang-cl
      CXX: clang-cl
      CXXFLAGS: -DNOMINMAX -DWIN32_LEAN_AND_MEAN -D_CRT_SECURE_NO_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - name: Set up native build tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cmake --version
          clang-cl --version
      - name: Build Windows app
        run: cargo build --locked --release -p foveonic-gui
      - name: Prepare Windows test shader compiler
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from setup_tests import prepare_dxc; prepare_dxc(install=True)"
      - name: Test Windows workspace
        env:
          # Test threads need room for nested fixtures. The packaged app keeps its normal stack.
          RUST_MIN_STACK: '8388608'
        run: cargo test --locked --release --workspace
      - name: Stage DirectX shader compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD '.local/test-dependencies/dxc_2026_09_29.zip'
          $uri = 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip'
          if (!(Test-Path -LiteralPath $zip)) { Invoke-WebRequest $uri -OutFile $zip }
          $expected = 'AD31B1FC8443175D204F77A611FDB3EF2EC42759BDC2F1167368DE24A4A7E7F1'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) { throw 'DXC archive checksum mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'dxc')
          $stage = Join-Path $env:RUNNER_TEMP 'Foveonic-windows-x64'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target/release/foveonic-gui.exe $stage
          $pdb = Join-Path $PWD 'target/release/foveonic_gui.pdb'
          if (!(Test-Path -LiteralPath $pdb)) { throw 'Matching application PDB was not produced' }
          Copy-Item $pdb $stage
          $symbols = Join-Path $env:RUNNER_TEMP 'Foveonic-windows-x64-symbols'
          New-Item -ItemType Directory -Path $symbols | Out-Null
          Copy-Item $pdb $symbols
          Get-FileHash target/release/foveonic-gui.exe,$pdb -Algorithm SHA256 | ConvertTo-Json | Set-Content (Join-Path $symbols 'build-files.json')
          Compress-Archive -Path $symbols -DestinationPath (Join-Path $env:RUNNER_TEMP 'Foveonic-windows-x64-symbols.zip')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'dxc/bin/x64/dxcompiler.dll') $stage
          Copy-Item (Join-Path $env:RUNNER_TEMP 'dxc/bin/x64/dxil.dll') $stage
          Copy-Item LICENSE $stage
          Copy-Item (Join-Path $env:RUNNER_TEMP 'dxc/LICENSE-LLVM.txt') $stage
          Copy-Item (Join-Path $env:RUNNER_TEMP 'dxc/LICENSE-MS.txt') $stage
          Copy-Item (Join-Path $env:RUNNER_TEMP 'dxc/LICENCE-MIT.txt') $stage
          $process = Start-Process (Join-Path $stage 'foveonic-gui.exe') -ArgumentList '--help' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows help-command check failed: $($process.ExitCode)" }
          Compress-Archive -Path $stage -DestinationPath (Join-Path $env:RUNNER_TEMP 'Foveonic-windows-x64.zip')
      - uses: actions/upload-artifact@v4
        with:
          name: Foveonic-windows-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Foveonic-windows-x64.zip
            ${{ runner.temp }}/Foveonic-windows-x64-symbols.zip
          if-no-files-found: error
