name: Build draft release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Unsigned macOS Apple Silicon app
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust and verify native tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          xcodebuild -version
          test "$(uname -m)" = arm64
          xcrun --find actool

      - name: Validate version and prepare changelog notes
        run: cargo xtask release-notes --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace and artwork
        run: |
          cargo test --locked --workspace
          python3 -m unittest discover -s crates/foveonic-gui/assets -p 'test_*.py'

      - name: Check Clippy and documentation
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo run --locked -p docs-index -- --check

      - name: Build native app bundle
        run: cargo xtask bundle --tag "$RELEASE_TAG"

      - name: Archive unsigned app
        run: |
          cd target/release
          archive="Foveonic-${RELEASE_TAG}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent Foveonic.app "$archive"
          shasum -a 256 "$archive" > SHA256SUMS

      - name: Upload to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "Refusing to modify a published release: $RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Foveonic $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" \
            "target/release/Foveonic-${RELEASE_TAG}-macos-arm64.zip" \
            target/release/SHA256SUMS --clobber
