name: Build draft release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Signed macOS Apple Silicon app
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust and verify native tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          xcodebuild -version
          test "$(uname -m)" = arm64
          xcrun --find actool

      - name: Fingerprint build tools and source
        id: build_cache
        run: python3 scripts/build_cache.py

      - name: Cache compatible Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/deps/*
            target/debug/build/*
            target/debug/.fingerprint/*
            target/release/deps/*
            target/release/build/*
            target/release/.fingerprint/*
            !target/*/deps/*foveonic*
            !target/*/deps/*docs_index*
            !target/*/deps/*xtask*
            !target/*/build/foveonic/**
            !target/*/build/foveonic-gui/**
            !target/*/build/docs-index/**
            !target/*/build/xtask/**
            !target/*/build/foveonic-*
            !target/*/build/docs-index-*
            !target/*/build/xtask-*
            !target/*/.fingerprint/foveonic-*
            !target/*/.fingerprint/docs-index-*
            !target/*/.fingerprint/xtask-*
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**') }}-${{ steps.build_cache.outputs.revision }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache.outputs.fingerprint }}-

      - name: Validate version and prepare changelog notes
        run: cargo xtask release-notes --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build native app bundle
        run: cargo xtask bundle --tag "$RELEASE_TAG"

      - name: Verify Sequoia deployment target
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, re, subprocess
          app = pathlib.Path("target/release/Foveonic.app/Contents")
          info = plistlib.loads((app / "Info.plist").read_bytes())
          if info.get("LSMinimumSystemVersion") != "15.0":
              raise SystemExit("Bundle must target macOS 15.0")
          build = subprocess.check_output([
              "xcrun", "vtool", "-show-build", str(app / "MacOS/foveonic-gui"),
          ], text=True)
          if re.findall(r"^\s*minos\s+(\S+)", build, re.MULTILINE) != ["15.0"]:
              raise SystemExit("Executable must target macOS 15.0")
          print(build)
          PY

      - name: Import certificate and sign app
        env:
          SIGNING_TEMP_DIR: ${{ runner.temp }}/foveonic-signing
          SIGNING_KEYCHAIN: ${{ runner.temp }}/foveonic-signing.keychain-db
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?Missing certificate secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing certificate password secret}"
          : "${APPLE_TEAM_ID:?Missing Team ID variable}"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          umask 077
          mkdir -m 700 "$SIGNING_TEMP_DIR"
          security list-keychains -d user > "$SIGNING_TEMP_DIR/keychains.txt.tmp"
          mv "$SIGNING_TEMP_DIR/keychains.txt.tmp" "$SIGNING_TEMP_DIR/keychains.txt"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$SIGNING_TEMP_DIR/certificate.p12"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 7200 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          # codesign requires search-list membership even with --keychain.
          python3 - "$SIGNING_TEMP_DIR/keychains.txt" "$SIGNING_KEYCHAIN" <<'PY'
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run([
              "security", "list-keychains", "-d", "user", "-s", sys.argv[2], *original,
          ], check=True)
          PY
          security import "$SIGNING_TEMP_DIR/certificate.p12" -k "$SIGNING_KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$SIGNING_TEMP_DIR/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$SIGNING_KEYCHAIN" > /dev/null
          identity="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | \
            awk -v team="$APPLE_TEAM_ID" '/"Developer ID Application:/ && index($0, "(" team ")\"") { print $2 }')"
          if [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity for the configured team."
            exit 1
          fi
          codesign --force --sign "$identity" --keychain "$SIGNING_KEYCHAIN" \
            --options runtime --timestamp target/release/Foveonic.app
          codesign --verify --deep --strict --verbose=2 target/release/Foveonic.app

      - name: Notarize, staple and verify app
        env:
          SIGNING_TEMP_DIR: ${{ runner.temp }}/foveonic-signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing Apple Account secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing app-specific password secret}"
          : "${APPLE_TEAM_ID:?Missing Team ID variable}"
          submission="$SIGNING_TEMP_DIR/submission.zip"
          result="$SIGNING_TEMP_DIR/notarization.json"
          ditto -c -k --sequesterRsrc --keepParent target/release/Foveonic.app "$submission"
          if ! xcrun notarytool submit "$submission" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json > "$result"; then
            if [ -s "$result" ]; then
              jq . "$result"
            fi
            echo "::error::Notarization failed or timed out. No release assets will be uploaded."
            exit 1
          fi
          jq . "$result"
          jq -e '.status == "Accepted"' "$result" > /dev/null
          xcrun stapler staple target/release/Foveonic.app
          xcrun stapler validate target/release/Foveonic.app
          codesign --verify --deep --strict --verbose=2 target/release/Foveonic.app
          spctl --assess --type execute --verbose=2 target/release/Foveonic.app

      - name: Archive signed and notarized app
        run: |
          cd target/release
          archive="Foveonic-${RELEASE_TAG}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent Foveonic.app "$archive"
          xcrun dsymutil Foveonic.app/Contents/MacOS/foveonic-gui -o Foveonic.app.dSYM
          xcrun dwarfdump --uuid Foveonic.app/Contents/MacOS/foveonic-gui > binary-uuid.txt
          xcrun dwarfdump --uuid Foveonic.app.dSYM > symbols-uuid.txt
          test "$(awk '{print $2}' binary-uuid.txt)" = "$(awk '{print $2}' symbols-uuid.txt)"
          test -s Foveonic.app.dSYM/Contents/Resources/DWARF/foveonic-gui
          symbols="Foveonic-${RELEASE_TAG}-macos-arm64-symbols.zip"
          ditto -c -k --keepParent Foveonic.app.dSYM "$symbols"
          shasum -a 256 "$archive" > SHA256SUMS
          shasum -a 256 "$symbols" > symbols-SHA256SUMS

      - name: Retain matching macOS symbols for developers
        uses: actions/upload-artifact@v4
        with:
          name: Foveonic-macos-arm64-symbols-${{ github.sha }}
          path: |
            target/release/Foveonic-${{ github.ref_name }}-macos-arm64-symbols.zip
            target/release/binary-uuid.txt
            target/release/symbols-uuid.txt
            target/release/symbols-SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Retain signed macOS app for validation
        uses: actions/upload-artifact@v4
        with:
          name: Foveonic-macos-arm64-${{ github.sha }}
          path: |
            target/release/Foveonic-${{ github.ref_name }}-macos-arm64.zip
            target/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Test workspace and artwork
        env:
          # Debug-mode GUI fixtures have large nested stack frames.
          RUST_MIN_STACK: '8388608'
        run: |
          cargo test --locked --workspace -- --test-threads=1
          python3 scripts/setup_tests.py --install
          .local/test-python/bin/python -m unittest discover -s crates/foveonic-gui/assets -p 'test_*.py'
          .local/test-python/bin/python -m unittest discover -s scripts/profiling -p 'test_*.py'
          .local/test-python/bin/python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check Clippy and documentation
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo run --locked -p docs-index -- --check

      - name: Upload to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "Refusing to upload for a tag that moved since this run started: $RELEASE_TAG" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "Refusing to modify a published release: $RELEASE_TAG" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Foveonic $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" \
            "target/release/Foveonic-${RELEASE_TAG}-macos-arm64.zip" \
            target/release/SHA256SUMS --clobber

      - name: Remove signing credentials and temporary files
        if: ${{ always() }}
        env:
          SIGNING_TEMP_DIR: ${{ runner.temp }}/foveonic-signing
          SIGNING_KEYCHAIN: ${{ runner.temp }}/foveonic-signing.keychain-db
        run: |
          status=0
          if [ -f "$SIGNING_TEMP_DIR/keychains.txt" ]; then
            python3 - "$SIGNING_TEMP_DIR/keychains.txt" <<'PY' || status=$?
          import pathlib, shlex, subprocess, sys
          original = shlex.split(pathlib.Path(sys.argv[1]).read_text())
          subprocess.run([
              "security", "list-keychains", "-d", "user", "-s", *original,
          ], check=True)
          PY
          fi
          if [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || status=$?
          fi
          rm -rf "$SIGNING_TEMP_DIR"
          exit "$status"

  windows:
    name: Build Windows x64 app
    uses: ./.github/workflows/windows-test.yml

  windows_draft:
    name: Attach Windows archive to draft
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: Foveonic-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/foveonic-release
      - name: Verify draft and attach Windows archive
        working-directory: ${{ runner.temp }}/foveonic-release
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "Refusing to upload for a tag that moved since this run started: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to modify a published release: $RELEASE_TAG" >&2
            exit 1
          fi
          mac="Foveonic-${RELEASE_TAG}-macos-arm64.zip"
          windows="Foveonic-${RELEASE_TAG}-windows-x64.zip"
          gh release download "$RELEASE_TAG" --pattern "$mac"
          mv Foveonic-windows-x64.zip "$windows"
          sha256sum "$mac" "$windows" > SHA256SUMS
          gh release upload "$RELEASE_TAG" "$windows" SHA256SUMS --clobber

  sequoia:
    name: Signed app binary loading on macOS 15
    needs: windows_draft
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download the signed draft assets
        run: |
          mkdir -p "$RUNNER_TEMP/foveonic-sequoia"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/foveonic-sequoia" \
            --pattern "Foveonic-${RELEASE_TAG}-macos-arm64.zip" --pattern SHA256SUMS

      - name: Verify signed executable loading on Sequoia
        working-directory: ${{ runner.temp }}/foveonic-sequoia
        run: |
          sw_vers
          test "$(sw_vers -productVersion | cut -d . -f1)" = 15
          test "$(uname -m)" = arm64
          grep -F "  Foveonic-${RELEASE_TAG}-macos-arm64.zip" SHA256SUMS | shasum -a 256 -c -
          ditto -x -k "Foveonic-${RELEASE_TAG}-macos-arm64.zip" .
          codesign --verify --deep --strict --verbose=2 Foveonic.app
          xcrun stapler validate Foveonic.app
          spctl --assess --type execute --verbose=2 Foveonic.app
          Foveonic.app/Contents/MacOS/foveonic-gui --help
