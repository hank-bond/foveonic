name: Build macOS test app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS Apple Silicon test archive
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust and verify native tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          xcodebuild -version
          test "$(uname -m)" = arm64
          xcrun --find actool
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Fingerprint build tools and source
        id: build_cache
        run: python3 scripts/build_cache.py

      - name: Cache compatible Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/deps/*
            target/debug/build/*
            target/debug/.fingerprint/*
            target/release/deps/*
            target/release/build/*
            target/release/.fingerprint/*
            !target/*/deps/*foveonic*
            !target/*/deps/*docs_index*
            !target/*/deps/*xtask*
            !target/*/build/foveonic/**
            !target/*/build/foveonic-gui/**
            !target/*/build/docs-index/**
            !target/*/build/xtask/**
            !target/*/build/foveonic-*
            !target/*/build/docs-index-*
            !target/*/build/xtask-*
            !target/*/.fingerprint/foveonic-*
            !target/*/.fingerprint/docs-index-*
            !target/*/.fingerprint/xtask-*
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**') }}-${{ steps.build_cache.outputs.revision }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/**') }}-
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build_cache.outputs.fingerprint }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build native test bundle
        run: |
          cargo xtask bundle
          # Without --deep, the extension keeps its sandboxed signature from cargo xtask bundle.
          codesign --force --sign - target/release/Foveonic.app
          codesign --verify --deep --strict target/release/Foveonic.app

      - name: Record source and package identity
        env:
          TEST_OUTPUT: ${{ runner.temp }}/foveonic-macos-test
        run: |
          mkdir "$TEST_OUTPUT"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, re, subprocess
          app = pathlib.Path('target/release/Foveonic.app')
          binary = app / 'Contents/MacOS/foveonic-gui'
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          build = subprocess.check_output(['xcrun', 'vtool', '-show-build', str(binary)], text=True)
          if info.get('LSMinimumSystemVersion') != '15.0' or re.findall(r'^\s*minos\s+(\S+)', build, re.MULTILINE) != ['15.0']:
              raise SystemExit('Test app must target macOS 15.0')
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if revision != os.environ['GITHUB_SHA'] or subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
              raise SystemExit('Test app source must match the clean workflow commit')
          identity = {'source_revision': revision, 'workflow_revision': os.environ['GITHUB_WORKFLOW_SHA'],
                      'version': info['CFBundleShortVersionString'], 'minimum_system': '15.0',
                      'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                      'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
                      'signing': 'ad-hoc test bundle', 'image_os': os.environ.get('ImageOS'),
                      'image_version': os.environ.get('ImageVersion')}
          (pathlib.Path(os.environ['TEST_OUTPUT']) / 'build.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
          ditto -c -k --keepParent target/release/Foveonic.app "$TEST_OUTPUT/Foveonic-macos-test.zip"
          cd "$TEST_OUTPUT"
          shasum -a 256 Foveonic-macos-test.zip build.json > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: macos-test-${{ github.sha }}
          path: ${{ runner.temp }}/foveonic-macos-test
          if-no-files-found: error
          retention-days: 14

      - name: Test workspace and supporting tools
        env:
          RUST_MIN_STACK: '8388608'
        run: |
          cargo test --locked --workspace -- --test-threads=1
          python3 scripts/setup_tests.py --install
          .local/test-python/bin/python -m unittest discover -s crates/foveonic-gui/assets -p 'test_*.py'
          .local/test-python/bin/python -m unittest discover -s scripts/profiling -p 'test_*.py'
          .local/test-python/bin/python -m unittest discover -s scripts -p 'test_*.py'

      - name: Check Clippy and documentation
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo run --locked -p docs-index -- --check
