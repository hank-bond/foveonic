[package]
name = "foveonic-gui"
version.workspace = true
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
foveonic = { path = "../foveonic" }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "persistence", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.16"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
tempfile = "3"
crossbeam-channel = "0.5.17"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CGColorSpace"] }
raw-window-handle = "0.6"
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
pollster = "0.4"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
