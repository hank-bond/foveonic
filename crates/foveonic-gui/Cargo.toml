[package]
name = "foveonic-gui"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
foveonic = { path = "../foveonic" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "persistence", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.16"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
