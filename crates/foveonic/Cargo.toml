[package]
name = "foveonic"
version.workspace = true
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
arrayvec = { version = "0.7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
tiff = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
jxl-sys = "=0.1.12"
moxcms = "0.8.1"
tempfile = "3"
rayon = "1.11"
perfetto-sdk = "1.2.1"
sha2 = "0.10"
fs2 = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry"] }
tracing-log = "0.2"
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Registry"] }
