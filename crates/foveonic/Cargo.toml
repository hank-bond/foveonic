[package]
name = "foveonic"
version.workspace = true
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
tiff = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = "3"
rayon = "1.11"
