[package]
name = "xtask"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
