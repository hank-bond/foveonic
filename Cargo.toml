[workspace]
resolver = "2"
members = ["crates/docs-index", "crates/foveonic", "crates/foveonic-gui", "crates/foveonic-quicklook", "crates/xtask"]
exclude = ["vendor/egui-wgpu", "vendor/tiff"]

[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
tiff = { path = "vendor/tiff" }

[workspace.package]
version = "0.9.2"

[profile.release.package.foveonic]
debug = 1

[profile.release.package.foveonic-gui]
debug = 1
