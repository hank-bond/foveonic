[workspace]
resolver = "2"
members = ["crates/docs-index", "crates/foveonic", "crates/foveonic-gui", "crates/xtask"]
exclude = ["vendor/egui-wgpu"]

[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }

[workspace.package]
version = "0.8.3"

[profile.release.package.foveonic]
debug = 1

[profile.release.package.foveonic-gui]
debug = 1
